# Model deployment configuration for the DeepSeek cost/latency benchmark.
#
# `deployment_name` is the value sent to the Foundry inference endpoint on
# every request — it is NOT the catalog model ID. Two projects can deploy
# the same catalog model under different deployment names, and a
# deployment name can be renamed without changing the underlying model.
# Confirm every `deployment_name` against your own Foundry project
# (Foundry Portal > Deployments) before running the benchmark; the client
# fails fast with a clear error if a deployment cannot be resolved, rather
# than silently falling back to a different one.
#
# `provider` selects the inference backend in src/client_factory.py:
#   - "azure-openai": openai.AzureOpenAI client, model=deployment_name.
#     Exposes OpenAI-specific usage fields (cached input tokens under
#     usage.prompt_tokens_details.cached_tokens, reasoning tokens under
#     usage.completion_tokens_details.reasoning_tokens) when the service
#     returns them.
#   - "deepseek" (and any other non-Azure-OpenAI provider): the unified
#     Foundry Models inference client (azure.ai.inference.ChatCompletionsClient),
#     model=deployment_name. Basic usage only (prompt/completion/total
#     tokens) — cached and reasoning token fields are recorded as null
#     when the provider doesn't return them; see src/inference_client.py.
#
# `pricing_key` links a model entry to config/pricing.yaml. It is
# separate from `deployment_name` because pricing is published per
# catalog model + deployment type + region, not per attendee-chosen
# deployment name.
#
# `supports_temperature` / `supports_top_p` / `supports_seed` default
# to true. Some deployments (reasoning models especially) reject a
# fixed value for one of these with a 400 error. The benchmark does
# NOT silently drop a rejected parameter and retry — the first
# rejection shows up as a normal failed request
# (error_type="unsupported_parameter") in output/requests.jsonl. Once
# you've seen that, flip the matching flag to false here so every
# later run records the omission explicitly instead of guessing at
# runtime. See src/models.py's ModelConfig docstring.

models:
  - logical_name: deepseek-v4-flash
    deployment_name: deepseek-v4-flash-3107
    provider: deepseek
    pricing_key: deepseek-v4-flash
    deployment_type: serverless
    enabled: true

  - logical_name: gpt-5-sol
    deployment_name: gpt-5-sol
    provider: azure-openai
    pricing_key: gpt-5
    deployment_type: standard
    enabled: true

  - logical_name: gpt-5-mini
    deployment_name: gpt-5-mini
    provider: azure-openai
    pricing_key: gpt-5-mini
    deployment_type: standard
    enabled: true
