# Versioned pricing table for the DeepSeek cost/latency benchmark.
#
# Kept outside the code on purpose (spec 2.12) so a price change never
# requires a code change, and so every benchmark run can record exactly
# which price table version it used.
#
# IMPORTANT: the prices below are PLACEHOLDER values (source:
# "manual-placeholder") — they are NOT verified against your Azure
# pricing page or negotiated rate. Replace every entry's price fields
# and set source to "manual-verified" (checked against the Azure
# pricing page by a person) or "retrieved" (pulled from the Azure
# Retail Prices API) before treating any cost output as real. The
# benchmark will still run with placeholder prices — estimated costs
# are clearly derived from a config file, never presented as billing
# fact — but src.pricing raises if `source` is missing entirely, so a
# forgotten entry can't silently look authoritative.
#
# Selection: for a given (provider, pricing_key), src.pricing picks the
# entry with the latest `effective_date` that is <= the benchmark run's
# start date and whose `deployment_type` and `region` match the model
# entry (region "any" matches every region).
#
# All prices are per 1,000,000 tokens, in `currency`.

pricing_version: "2026-08-25-placeholder-1"

entries:
  - provider: deepseek
    model: deepseek-v4-flash
    deployment_type: serverless
    region: any
    input_price_per_million: 0.14
    cached_input_price_per_million: 0.07
    output_price_per_million: 0.28
    currency: USD
    effective_date: "2026-01-01"
    source: manual-placeholder

  - provider: azure-openai
    model: gpt-5
    deployment_type: standard
    region: any
    input_price_per_million: 1.75
    cached_input_price_per_million: 0.44
    output_price_per_million: 7.00
    currency: USD
    effective_date: "2026-01-01"
    source: manual-placeholder

  - provider: azure-openai
    model: gpt-5-mini
    deployment_type: standard
    region: any
    input_price_per_million: 0.35
    cached_input_price_per_million: 0.09
    output_price_per_million: 1.40
    currency: USD
    effective_date: "2026-01-01"
    source: manual-placeholder
