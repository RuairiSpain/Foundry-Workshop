[pytest]
# Own rootdir/config, separate from the repo root's — this project has
# no `starter`/`solution` split and isn't part of run_all_tests.sh.
# `pythonpath = .` lets `tests/*.py` do `from src.X import ...`
# regardless of the invoking working directory.
pythonpath = .
testpaths = tests
markers =
    live: exercises a real Azure endpoint. Excluded by default (-m "not live").
addopts = -m "not live"
