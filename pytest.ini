[pytest]
# Every lab's tests import shared fixtures from case-study/ (the mock
# orders API, the Foundry SDK fakes) without a per-lab conftest.py.
# pytest finds this file by walking up from wherever a lab's tests run,
# so `cd labs/lab-09-classic-agent && pytest tests/` picks it up too.
pythonpath = case-study
# Lab 11's MCP server tools are async; auto mode means only `async def
# test_...` needs marking, not every one with @pytest.mark.asyncio.
asyncio_mode = auto
